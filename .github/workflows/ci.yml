name: Platform CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TTLAB_DATABASE_URL: sqlite:///./ttlab-ci.db
      TTLAB_SECURITY_MODE: local_demo
      TTLAB_ALLOW_INSECURE_LOCAL_DEMO: "false"
      TTLAB_DEMO_CORPUS_PREVIEW: "false"
      TTLAB_DEFAULT_LLM_PROVIDER: offline_extractive
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ocr.txt
      - name: Install backend and OCR test dependencies
        run: |
          python -m pip install -r backend/requirements.txt -r backend/requirements-ocr.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Test backend
        run: python -m pytest -m "not archived_reproduction" --junitxml=reports/backend.xml
      - name: Validate local launchers
        run: bash -n scripts/run_everything.sh scripts/start_demo.sh scripts/start_authenticated_stack.sh
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-test-results
          path: reports/backend.xml
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend, including accessibility
        run: npm test -- --reporter=default --reporter=junit --outputFile=../reports/frontend.xml
      - name: Build frontend
        run: npm run build
      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-test-results
          path: reports/frontend.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Upload frontend build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7
